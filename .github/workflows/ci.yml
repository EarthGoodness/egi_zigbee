name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  # 1) Home Assistant manifest validation
  hassfest:
    name: Validate with hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: home-assistant/actions/hassfest@master

  # 2) HACS repository validation
  hacs:
    name: Validate with HACS Action
    runs-on: ubuntu-latest
    needs: hassfest
    steps:
      - uses: actions/checkout@v3
      - uses: hacs/action@22.5.0
        with:
          category: integration

  # 3) Lint Python code
  lint:
    name: Lint with Flake8
    runs-on: ubuntu-latest
    needs: [hassfest, hacs]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install flake8
        run: pip install flake8
      - name: Run flake8
        run: flake8 custom_components/egi_zigbee
