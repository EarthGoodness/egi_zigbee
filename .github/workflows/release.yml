name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Read version from manifest
        id: read_version
        uses: ashley-taylor/read-json-property-action@v1.0
        with:
          path: ./egi_zigbee/custom_components/egi_zigbee/manifest.json
          property: version

      - name: Get latest GitHub release
        id: get_latest
        uses: joutvhu/get-release@v1
        with:
          latest: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare versions
        run: |
          echo "Manifest version: ${{ steps.read_version.outputs.value }}"
          echo "Latest release:   ${{ steps.get_latest.outputs.name }}"

      - name: Create ZIP of integration
        if: ${{ steps.read_version.outputs.value != steps.get_latest.outputs.name }}
        run: |
          zip -r egi_zigbee-v${{ steps.read_version.outputs.value }}.zip \
              custom_components/egi_zigbee

      - name: Create GitHub Release
        if: ${{ steps.read_version.outputs.value != steps.get_latest.outputs.name }}
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.read_version.outputs.value }}
          name: v${{ steps.read_version.outputs.value }}
          artifacts: egi_zigbee-v${{ steps.read_version.outputs.value }}.zip
